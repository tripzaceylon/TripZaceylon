<style>
:root{
  --deep:#1a2c22;--ocean:#2f4b3a;--teal:#4f7457;--leaf:#5f855f;--lime:#bfd3ae;
  --ink:#1e2a22;--muted:#6a7a6c;--line:rgba(47,75,58,.16);
  --grad:linear-gradient(120deg,var(--ocean),var(--teal) 55%,var(--leaf));
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;color:var(--ink);background:#fcfdfa;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{width:min(1180px,92vw);margin:0 auto}

/* ---- nav ---- */
header{background:var(--deep);padding:1rem 0;position:sticky;top:0;z-index:50}
.nav{display:flex;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;padding-top:.15rem}
.logo .mark{height:56px;width:auto;flex:0 0 auto;border-radius:0;object-fit:contain;background:none}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.8);
  font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:.3s}
.back:hover{color:#fff}
.back svg{width:14px;height:14px;fill:currentColor}

/* ---- hero ---- */
.hero{position:relative;height:min(58vh,460px);overflow:hidden;background:var(--deep)}
.hero img{filter:saturate(.72) contrast(.97)}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(26,44,34,.95) 6%,rgba(26,44,34,.4) 55%,rgba(26,44,34,.2))}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding-bottom:2.4rem;color:#fff}
.chip{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:.42rem .9rem;border-radius:99px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);margin-bottom:1rem}
.hero h1{font-weight:800;text-transform:uppercase;font-size:clamp(2rem,5.4vw,3.6rem);
  line-height:.98;letter-spacing:-.035em}

/* ---- article ---- */
.layout{display:grid;grid-template-columns:1.4fr .6fr;gap:3.4rem;align-items:start;padding:3.4rem 0 4.5rem}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:2rem}}
.lead{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(1.15rem,2.1vw,1.5rem);
  line-height:1.5;color:var(--ocean);margin-bottom:1.8rem}
.body p{font-weight:300;font-size:1rem;line-height:1.95;color:rgba(30,42,34,.8);margin-bottom:1.15rem;max-width:38rem}
.shot{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,42,34,.4);
  font-weight:500;margin-top:1.6rem}
.facts{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.4rem;position:sticky;top:5.2rem}
@media(max-width:900px){.facts{position:static}}
.facts h3{font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.18em;color:var(--leaf);margin-bottom:1rem}
.facts dl{display:grid;gap:.85rem}
.facts dt{font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,42,34,.42)}
.facts dd{font-size:.86rem;font-weight:400;line-height:1.55;color:var(--ink);margin-top:.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;width:100%;border:0;
  cursor:pointer;padding:.9rem 1.3rem;border-radius:99px;font-family:inherit;font-size:.8rem;
  font-weight:600;background:var(--grad);color:#fff;transition:.3s;margin-top:1.4rem;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);margin-top:.55rem}
.btn.ghost:hover{background:#f4f7f2;transform:none}
.btn svg{width:15px;height:15px;fill:currentColor}

/* ---- five more: cards in a row, same design as the map card on the home page ---- */
#more{background:#f4f7f2;padding:4.5rem 0 5.5rem;border-top:1px solid var(--line)}
#more .eyebrow{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--leaf)}
#more h2{font-weight:800;text-transform:uppercase;font-size:clamp(1.5rem,3vw,2.1rem);
  line-height:1.05;letter-spacing:-.03em;margin-top:.7rem}
.more-head{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;
  flex-wrap:wrap;margin-bottom:2.2rem}
.pill{display:inline-flex;align-items:center;gap:.9rem;padding:.34rem .34rem .34rem 1.35rem;
  border:1px solid rgba(17,28,22,.16);border-radius:99px;background:#fff;
  font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);transition:.3s;white-space:nowrap}
.pill i{width:34px;height:34px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;flex:0 0 auto}
.pill i svg{width:14px;height:14px;fill:#fff}
.pill:hover{background:#fff;border-color:var(--leaf)}

.more-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.1rem;align-items:start}
@media(max-width:1100px){.more-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.more-grid{grid-template-columns:repeat(2,1fr);gap:.8rem}}
@media(max-width:460px){.more-grid{grid-template-columns:1fr}}

.mcard{
  display:block;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 20px 50px -34px rgba(17,28,22,.45);transition:transform .3s,box-shadow .3s,border-color .3s;
}
.mcard:hover{transform:translateY(-5px);box-shadow:0 26px 54px -28px rgba(17,28,22,.5);border-color:transparent}
.mcard .pic{aspect-ratio:4/3;position:relative;overflow:hidden;background:#eceee9}
.mcard .pic img{filter:saturate(.72) contrast(.97);transition:transform 6s ease}
.mcard:hover .pic img{transform:scale(1.05)}
.mcard .txt{padding:1.15rem 1.2rem 1.35rem}
.mcard h4{font-weight:700;text-transform:uppercase;font-size:.94rem;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
.mcard .reg{display:block;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(17,28,22,.4);font-weight:500;margin:.4rem 0 .65rem}
.mcard p{font-weight:300;font-size:.8rem;line-height:1.7;color:rgba(17,28,22,.68)}
.mcard .go{margin-top:.95rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;transition:.3s}
.mcard:hover .go{background:var(--leaf);border-color:var(--leaf)}
.mcard .go svg{width:14px;height:14px;fill:var(--ink);transition:.3s}
.mcard:hover .go svg{fill:#fff}

footer{background:#16241c;color:rgba(255,255,255,.5);font-size:.76rem;padding:1.6rem 0;text-align:center}
footer a{color:rgba(255,255,255,.75)}
.miss{padding:5rem 0;text-align:center}

/* ---- floating contact ---- */
.fab{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:1100;display:flex;flex-direction:column;gap:.6rem}
.fab-btn{display:flex;align-items:center;justify-content:flex-end;width:52px;height:52px;border-radius:99px;
  overflow:hidden;color:#fff;box-shadow:0 10px 26px -8px rgba(10,20,14,.5);
  transition:width .32s cubic-bezier(.2,.85,.25,1),box-shadow .3s;animation:fabIn .6s ease backwards}
.fab-btn.wa{background:#25d366;animation-delay:.3s}
.fab-btn.ig{background:linear-gradient(45deg,#f9a03f 0%,#d6266b 48%,#8a3ab9 100%);animation-delay:.6s}
.fab-btn.fb{background:#1877f2;animation-delay:.75s}
.fab-btn.em{background:#3d6047;animation-delay:.45s}
@keyframes fabIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.fab-btn svg{width:24px;height:24px;fill:currentColor;flex:0 0 auto;margin-right:14px}
.fab-lab{font-size:.74rem;font-weight:600;white-space:nowrap;opacity:0;padding-left:16px;transition:opacity .22s}
.fab-btn:hover{width:168px}
.fab-btn:hover .fab-lab{opacity:1}
@media(max-width:700px){
  .fab{right:12px;top:auto;bottom:14px;transform:none;flex-direction:column-reverse}
  .fab-btn,.fab-btn:hover{width:46px}.fab-btn{height:46px}
  .fab-btn svg{width:21px;height:21px;margin-right:12.5px}.fab-lab{display:none}
}
</style>
<style>
.terms{list-style:none;display:grid;gap:.6rem;margin-top:.4rem}
.terms li{font-weight:300;font-size:.9rem;line-height:1.65;color:rgba(30,42,34,.72);
  padding-left:1.5rem;position:relative}
.terms li::before{content:'';position:absolute;left:0;top:.5em;width:7px;height:7px;
  border-radius:2px;background:var(--leaf)}
h3.sub{font-weight:700;text-transform:uppercase;font-size:.7rem;letter-spacing:.18em;
  color:var(--leaf);margin:2.2rem 0 .9rem}
.chip.gold{background:rgba(212,175,55,.18);border-color:rgba(212,175,55,.5);color:#f0dfa8}
/* the actual saving, pulled out of the prose so it cannot be missed */
.hl{
  font-weight:700;color:#7a5a12;background:linear-gradient(180deg,transparent 58%,rgba(212,175,55,.42) 58%);
  padding:0 .12em;border-radius:2px;white-space:nowrap;
}
.lead .hl{color:#6d4f0d;background:linear-gradient(180deg,transparent 62%,rgba(212,175,55,.45) 62%)}
.facts .hl{
  display:inline-block;background:rgba(212,175,55,.22);border:1px solid rgba(212,175,55,.55);
  color:#6d4f0d;padding:.16rem .5rem;border-radius:6px;font-size:.95em;white-space:normal;
}
.terms .hl{background:linear-gradient(180deg,transparent 60%,rgba(212,175,55,.38) 60%)}
</style>
</head>

<script>
const ALL = [{"slug":"early-planner","name":"Early Planner","valid":"Valid for travel until 30 April 2027","img":"photo-1612862862126-865765df2ded","shot":"Sigiriya rock rising from the plain","short":"Book <b class=\"hl\">120 days</b> ahead and take <b class=\"hl\">up to 15%</b> off any private itinerary — same guides, same stays, lower rate.","lead":"Book far enough ahead and the whole thing costs less, because it costs us less.","body":["Hotels price by the calendar. A room held <b class=\"hl\">120 days</b> out is worth more to a property than the same room held 20 days out, and small family-run places in particular will trade a discount for the certainty. We pass that on rather than keep it — the discount you see is the discount we were given.","The saving runs to <b class=\"hl\">15% on the accommodation portion</b> of a private itinerary, which typically works out at <b class=\"hl\">8–11% of the total</b> once vehicles, guides and entries are counted. It applies to any route: our published packages, or something built from scratch.","It also buys you the good stuff. The four-room places, the estate bungalows, the two tented camps worth staying in — these have almost no inventory and go months ahead in season. Booking early is less about the money than about actually getting them."],"terms":["Deposit within 14 days of confirming the itinerary","Applies to the accommodation portion of the trip","Combinable with the long-stay offer, not with green season rates","Travel completed by 30 April 2027"],"facts":[["Discount","<b class=\"hl\">Up to 15%</b>"],["Book by","120 days before travel"],["Applies to","Any private itinerary"],["Travel before","30 April 2027"]]},{"slug":"stay-longer","name":"Stay Longer, Pay Less","valid":"Itineraries of 10 nights or more","img":"photo-1580910527739-556eb89f9d65","shot":"Palms along the eastern shore","short":"<b class=\"hl\">The tenth night is on us</b>, plus a complimentary cooking session with the family who host you.","lead":"<b class=\"hl\">Ten nights</b> is where a Sri Lanka trip stops being a tour and starts being a stay.","body":["Most people come for a week, and a week means driving. Sigiriya to Kandy to Ella to the coast, one or two nights each, packing every morning. <b class=\"hl\">Ten nights or more</b> changes the arithmetic entirely: you can give a place three nights, walk somewhere without watching the clock, and have a day where nothing is scheduled.","So we make <b class=\"hl\">the tenth night free</b>. Not a credit or a voucher — one night's accommodation removed from the invoice, at whatever standard you have chosen.","It comes with an afternoon in a home kitchen: a family we have worked with for years, scraping coconut, roasting curry powder, and eating what you have made. It is consistently the thing guests write to us about afterwards, more than any of the sites."],"terms":["Ten consecutive nights or more on a single itinerary","The free night is the lowest-rated night of the trip","Cooking session subject to the family's availability","Cannot be exchanged for cash or a discount"],"facts":[["You get","<b class=\"hl\">One free night</b>"],["Minimum","10 consecutive nights"],["Also included","A home cooking session"],["Season","Year-round"]]},{"slug":"green-season","name":"Green Season Escape","valid":"May to September","img":"photo-1646894232861-a0ad84f1ad5d","shot":"A palm-backed bay on the east coast","short":"The east coast at its best and the south at its quietest — <b class=\"hl\">up to 25% off</b>, whale watching from Trincomalee included.","lead":"Sri Lanka does not have an off season. It has two coasts and two monsoons, and they take turns.","body":["From <b class=\"hl\">May to September</b> the south-west monsoon puts rain on the beaches everyone has heard of, and the industry calls it low season. Meanwhile the east coast — Trincomalee, Pasikudah, Arugam Bay — is having its best months of the year: flat mornings, dependable swell at Arugam, and water clear enough to see the bottom at Pigeon Island.","Prices on that side do not follow the logic. You can have Nilaveli in perfect weather for materially less than Mirissa in the same month, and the cultural triangle and the hill country stay perfectly workable throughout.","The rate runs up to <b class=\"hl\">25% off across the itinerary</b>, and a whale-watching trip out of Trincomalee is included — blue whales pass the east between <b class=\"hl\">May and October</b>, and the boats there are far quieter than the southern fleet."],"terms":["Travel between 1 May and 30 September","Itinerary weighted towards the east and the interior","Whale trip subject to sea conditions, rescheduled if cancelled","Not combinable with the early-planner discount"],"facts":[["Discount","<b class=\"hl\">Up to 25%</b>"],["Season","May–September"],["Included","Whale watching from Trincomalee"],["Best for","East coast and hill country"]]}];
const IMG = (id, w) => `https://images.unsplash.com/${id}?fm=jpg&q=80&w=${w}&auto=format&fit=crop`;
const slug = new URLSearchParams(location.search).get('o');
const o = ALL.find(x => x.slug === slug);
const main = document.getElementById('main');

if (!o){
  main.innerHTML = `<div class="wrap miss">
    <h1 style="font-size:1.6rem;font-weight:800;text-transform:uppercase">Offer not found</h1>
    <p style="margin-top:.8rem;color:rgba(30,42,34,.6);font-weight:300">Try one of the others below.</p></div>`;
} else {
  document.title = o.name.replace(/&amp;/g, '&') + ' — TripzaCeylon';
  main.innerHTML = `
    <div class="hero">
      <img src="${IMG(o.img, 2000)}" alt="${o.shot}">
      <div class="veil"></div>
      <div class="in"><div class="wrap">
        <span class="chip gold">${o.valid}</span>
        <h1>${o.name}</h1>
      </div></div>
    </div>
    <div class="wrap layout">
      <div>
        <p class="lead">${o.lead}</p>
        <div class="body">${o.body.map(p => `<p>${p}</p>`).join('')}</div>
        <h3 class="sub">The terms, in full</h3>
        <ul class="terms">${o.terms.map(t => `<li>${t}</li>`).join('')}</ul>
        <p class="shot">Photograph: ${o.shot}</p>
      </div>
      <aside class="facts">
        <h3>At a glance</h3>
        <dl>${o.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
        <a class="btn" href="build-your-trip.html#enquire">Claim this offer
          <svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7v-5H4v-4h9V5Z"/></svg></a>
        <a class="btn ghost" href="index.html#packages">See the packages</a>
      </aside>
    </div>`;
}

document.getElementById('grid').innerHTML = ALL.filter(x => x.slug !== slug).map(x => `
  <a class="mcard" href="offer.html?o=${x.slug}">
    <div class="pic"><img loading="lazy" src="${IMG(x.img, 700)}" alt="${x.shot}"></div>
    <div class="txt">
      <h4>${x.name}</h4>
      <span class="reg">${x.valid}</span>
      <p>${x.short}</p>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7v-5H4v-4h9V5Z"/></svg></span>
    </div>
  </a>`).join('');
</script>
