<!DOCTYPE html>
<!--
  ============================================================================
  TripzaCeylon — enquire.html (redirect only)
  ============================================================================
  The enquiry form used to live here as its own page. It now sits underneath
  the route planner on build-your-trip.html, so a visitor draws their route
  first and sends it from the same page.

  This file stays behind so that any old link, bookmark or shared URL still
  works. It forwards straight through, carrying ?p=<package-slug> with it and
  landing on the #enquire section.

  Nothing else should link here — every button on the site now points at
  build-your-trip.html#enquire directly.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquire — TripzaCeylon</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<!-- fallback for anyone with JavaScript off: the meta refresh still fires,
     it just can't carry the ?p= package across -->
<meta http-equiv="refresh" content="0; url=build-your-trip.html#enquire">
<style>
  body{font-family:system-ui,sans-serif;background:#fcfdfa;color:#1e2a22;
       display:grid;place-items:center;height:100vh;margin:0;text-align:center}
  a{color:#4f7457}
</style>
</head>
<body>
  <p>Taking you to the enquiry form… <a href="build-your-trip.html#enquire">continue</a></p>
<script>
/* forward immediately, keeping ?p=<package-slug> so a package chosen on the
   home page is still pre-selected when the form loads */
var q = location.search || '';
location.replace('build-your-trip.html' + q + '#enquire');
</script>
</body>
</html>
