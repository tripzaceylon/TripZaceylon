<style>
:root{
  --deep:#1a2c22;--ocean:#2f4b3a;--teal:#4f7457;--leaf:#4f7a4f;--lime:#bfd3ae;
  --ink:#1e2a22;--muted:#5c6b60;--line:rgba(47,75,58,.16);
  --grad:linear-gradient(120deg,var(--ocean),var(--teal) 55%,var(--leaf));
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;color:var(--ink);background:#fcfdfa;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{width:min(1180px,92vw);margin:0 auto}

/* ---- nav ---- */
header{background:var(--deep);padding:1rem 0;position:sticky;top:0;z-index:50}
.nav{display:flex;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;padding-top:.15rem}
.logo .mark{height:56px;width:auto;flex:0 0 auto;border-radius:0;object-fit:contain;background:none}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.8);
  font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:.3s}
.back:hover{color:#fff}
.back svg{width:14px;height:14px;fill:currentColor}

/* ---- hero ---- */
.hero{position:relative;height:min(58vh,460px);overflow:hidden;background:var(--deep)}
.hero img{filter:saturate(.72) contrast(.97)}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(26,44,34,.95) 6%,rgba(26,44,34,.4) 55%,rgba(26,44,34,.2))}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding-bottom:2.4rem;color:#fff}
.chip{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:.42rem .9rem;border-radius:99px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);margin-bottom:1rem}
.hero h1{font-weight:800;text-transform:uppercase;font-size:clamp(2rem,5.4vw,3.6rem);
  line-height:.98;letter-spacing:-.035em}

/* ---- article ---- */
.layout{display:grid;grid-template-columns:1.4fr .6fr;gap:3.4rem;align-items:start;padding:3.4rem 0 4.5rem}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:2rem}}
.lead{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(1.15rem,2.1vw,1.5rem);
  line-height:1.5;color:var(--ocean);margin-bottom:1.8rem}
.body p{font-weight:300;font-size:1rem;line-height:1.95;color:rgba(30,42,34,.8);margin-bottom:1.15rem;max-width:38rem}
.shot{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,42,34,.4);
  font-weight:500;margin-top:1.6rem}
.facts{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.4rem;position:sticky;top:5.2rem}
@media(max-width:900px){.facts{position:static}}
.facts h3{font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.18em;color:var(--leaf);margin-bottom:1rem}
.facts dl{display:grid;gap:.85rem}
.facts dt{font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,42,34,.42)}
.facts dd{font-size:.86rem;font-weight:400;line-height:1.55;color:var(--ink);margin-top:.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;width:100%;border:0;
  cursor:pointer;padding:.9rem 1.3rem;border-radius:99px;font-family:inherit;font-size:.8rem;
  font-weight:600;background:var(--grad);color:#fff;transition:.3s;margin-top:1.4rem;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);margin-top:.55rem}
.btn.ghost:hover{background:#f4f7f2;transform:none}
.btn svg{width:15px;height:15px;fill:currentColor}

.more-head{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;

.pill i svg{width:14px;height:14px;fill:#fff}
.pill:hover{background:#fff;border-color:var(--leaf)}

.mcard{

}
.mcard:hover{transform:translateY(-5px);box-shadow:0 26px 54px -28px rgba(17,28,22,.5);border-color:transparent}
.mcard .pic{aspect-ratio:4/3;position:relative;overflow:hidden;background:#eceee9}
.mcard .pic img{filter:saturate(.72) contrast(.97);transition:transform 6s ease}
.mcard:hover .pic img{transform:scale(1.05)}
.mcard .txt{padding:1.15rem 1.2rem 1.35rem}

.mcard p{font-weight:300;font-size:.8rem;line-height:1.7;color:rgba(17,28,22,.68)}
.mcard .go{margin-top:.95rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;transition:.3s}
.mcard:hover .go{background:var(--leaf);border-color:var(--leaf)}
.mcard .go svg{width:14px;height:14px;fill:var(--ink);transition:.3s}
.mcard:hover .go svg{fill:#fff}

/* ---- floating contact ---- */
.fab{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:1100;display:flex;flex-direction:column;gap:.6rem}
.fab-btn{display:flex;align-items:center;justify-content:flex-end;width:52px;height:52px;border-radius:99px;
  overflow:hidden;color:#fff;box-shadow:0 10px 26px -8px rgba(10,20,14,.5);
  transition:width .32s cubic-bezier(.2,.85,.25,1),box-shadow .3s;animation:fabIn .6s ease backwards}
.fab-btn.wa{background:#25d366;animation-delay:.3s}
.fab-btn.ig{background:linear-gradient(45deg,#f9a03f 0%,#d6266b 48%,#8a3ab9 100%);animation-delay:.6s}
.fab-btn.fb{background:#1877f2;animation-delay:.75s}
.fab-btn.em{background:#3d6047;animation-delay:.45s}
@keyframes fabIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.fab-btn svg{width:24px;height:24px;fill:currentColor;flex:0 0 auto;margin-right:14px}
.fab-lab{font-size:.74rem;font-weight:600;white-space:nowrap;opacity:0;padding-left:16px;transition:opacity .22s}
.fab-btn:hover{width:168px}

.skip{position:absolute;left:-9999px;top:0;z-index:2000;background:#fff;color:#1e2a22;
  padding:.75rem 1.1rem;border-radius:0 0 10px 0;font-size:.82rem;font-weight:600;text-decoration:none}
.skip:focus{left:0}
:focus-visible{outline:3px solid #5f855f;outline-offset:2px}

<script>
const ALL = [{"slug":"cultural-triangle","name":"Cultural Triangle","kind":"Destination","region":"Anuradhapura · Polonnaruwa · Sigiriya · Dambulla","img":"photo-1711797750174-c3750dd9d7c9","shot":"Sigiriya rock from the air, ringed by forest","text":"Two thousand years of capitals, cave temples and reservoirs, inside one triangle of dry-zone scrub.","lead":"Four sites, four UNESCO listings, and a road network that lets you see all of them from a single base. This is where most first trips to Sri Lanka begin, and there is a reason for that.","body":["The triangle is drawn between Anuradhapura in the north-west, Polonnaruwa in the east and Kandy in the south, with Sigiriya and Dambulla in the middle. Anuradhapura ran as a capital for 1,400 years and is spread over 40 square kilometres, so you want wheels. Polonnaruwa replaced it, lasted two hundred years, and is tight enough to cycle in a morning. Sigiriya is the 200-metre rock with a palace on top; Dambulla is five painted caves under one granite overhang.","The thing nobody tells you is how much of this is hydraulic engineering rather than religion. The dry zone gets under 1,500mm of rain in a short season, and the entire civilisation ran on reservoirs — tanks, they are called here — some of them 2,000 years old and still irrigating paddy today. Once you notice them you see them everywhere, and the ruins start to make a different kind of sense.","Heat is the practical constraint. By ten in the morning the stone is too hot to stand on barefoot, and the Sigiriya climb becomes genuinely unpleasant. Everything here is a 6am start, a long lunch, and a second site at four. Plan three or four nights; two is possible but you will be rushing the part of the trip that rewards slowness most.","Minneriya and Kaudulla national parks sit inside the same triangle. Between roughly July and October several hundred elephants gather on the receding Minneriya tank bed — the largest congregation of wild Asian elephants anywhere — which makes an afternoon safari an easy addition to a ruins morning."],"facts":[["Best time","Dec–Mar; Jul–Oct for the Gathering"],["How long","3–4 nights"],["Base yourself","Sigiriya, Dambulla or Giritale"],["Getting there","4 hrs from Colombo"]]},{"slug":"kandy-hill-country","name":"Kandy & Hill Country","kind":"Destination","region":"Kandy · Nuwara Eliya · Hatton · Horton Plains","img":"photo-1665849050430-5e8c16bacf7e","shot":"The Temple of the Sacred Tooth Relic, Kandy","text":"The last royal capital, then a climb into tea country, cold mornings and the best train ride in Asia.","lead":"Kandy held out against the Portuguese and the Dutch and only fell to the British in 1815, which is why it still feels like the cultural centre of the island rather than a colonial afterthought.","body":["The Temple of the Sacred Tooth Relic is the reason to be here. It holds what is believed to be the Buddha’s left canine, and possession of it was historically tied to the right to rule the island. Three pujas a day open the inner chamber; the 6.30pm one is the one to aim for. Dress covered, expect a crowd, and give it an hour.","From Kandy the land goes up. Nuwara Eliya sits at 1,868 metres and gets cold enough at night to want a fire — the British built it as a hill station and the half-timbered hotels, the racecourse and the post office are all still there, looking faintly absurd in the tropics. The tea starts around Ramboda and does not stop.","Horton Plains is the walk worth building a day around: a nine-and-a-half kilometre loop across montane grassland to World’s End, a cliff that drops 870 metres in one step. Leave at first light, because the view is gone under cloud by nine or ten most mornings. It is the coldest place in Sri Lanka and the only one where you might see frost.","The train from Kandy to Ella is the other reason people come. Six or seven hours through tea estates and cloud forest, and the section between Nanu Oya and Ella is the part that ends up on everybody’s camera roll. Book reserved seats well ahead, or take second class unreserved and stand at the door like everyone else."],"facts":[["Best time","Jan–Apr; Jul–Aug for the Perahera"],["How long","3–4 nights"],["Bring","A fleece — nights drop near freezing"],["Getting there","3 hrs from Colombo by road"]]},{"slug":"ella-nine-arch","name":"Ella & Nine Arch","kind":"Destination","region":"Ella · Bandarawela · Haputale · Demodara","img":"photo-1566296314736-6eaac1ca0cb9","shot":"The blue train on the Nine Arch Bridge","text":"A hill village that became a viewpoint: the bridge, Little Adam’s Peak, and the end of the famous train line.","lead":"Ella is small, steep and unashamedly geared to visitors — and it is still worth it, because the walks start at the edge of the village and the bridge really does look like that.","body":["The Nine Arch Bridge was finished in 1921, is 91 metres long and was reportedly built entirely from brick, stone and cement because steel was unavailable during the First World War. Trains cross it perhaps eight times a day. Check the timetable at your guesthouse, get there twenty minutes early, and walk in from the Gotuwala side to avoid the worst of the crowd.","Little Adam’s Peak is forty-five minutes up and rewards you out of all proportion to the effort — a grassy ridge with tea on three sides. Ella Rock is the harder one: two and a half hours, poorly signed, and worth taking someone who knows the path. Both are best before eight, when the valley is still holding mist.","Twenty minutes away, the Demodara loop is a piece of railway engineering that sounds made up: the line spirals under itself through a tunnel to lose height, and the station master will show you the spot. Ravana Falls is on the road out towards Wellawaya and is at its most dramatic right after rain.","Haputale and Bandarawela are the quieter alternatives twenty and thirty minutes west, both with the same views and a fraction of the banana-pancake cafés. Lipton’s Seat above Haputale is a sunrise that most people miss because they are all in Ella."],"facts":[["Best time","Jan–Mar, Jul–Sep"],["How long","2–3 nights"],["Do not miss","The train in from Nanu Oya"],["Getting there","7 hrs by train from Kandy"]]},{"slug":"yala-wilpattu","name":"Yala & Wilpattu","kind":"Destination","region":"Yala · Wilpattu · Udawalawe · Bundala","img":"photo-1571406761758-9a3eed5338ef","shot":"Wild elephants in the dry-zone scrub","text":"The parks: leopards in the south-east, sloth bears in the north-west, and elephants almost anywhere you point a jeep.","lead":"Sri Lanka has one of the highest leopard densities in the world, and unusually, the leopards here sit at the top of the food chain — which makes them bold and diurnal in a way they are not in Africa.","body":["Yala Block 1 is where the sightings are, and it is also where every other jeep is. In peak season the gate queue starts before dawn and a leopard on a rock can gather twenty vehicles. It is still worth doing: the density is real, and the park has elephants, sloth bears, crocodiles and over 200 bird species alongside them. Book a morning drive, and consider Block 5 for a quieter version.","Wilpattu is the counter-argument. Three times the size, a fraction of the traffic, and a completely different landscape — villus, natural sand-rimmed lakes that fill with rain and pull the animals to them. Leopard sightings are less frequent but you will often have one entirely to yourself. Sloth bears are best from February to June when the palu fruit ripens.","Udawalawe is the elephant park. Around 600 resident animals in open scrub, which means a half-day drive without a sighting is close to unheard of. The Elephant Transit Home on the boundary milk-feeds orphaned calves and releases them back into the park — you watch a feeding from a platform, with no contact, which is the point.","A word on ethics, because it matters here: we do not book elephant rides, bathing experiences or any operator that lets vehicles crowd or corner an animal. If a driver offers to get closer for a tip, that is the moment to say no. Bundala, twenty minutes from Tissamaharama, is the quiet one — flamingos from September to March and hardly a jeep in sight."],"facts":[["Best time","Feb–Jul for Yala; Feb–Oct Wilpattu"],["How long","1–2 nights per park"],["Drives","Dawn and late afternoon only"],["Base yourself","Tissamaharama or Anuradhapura"]]},{"slug":"southern-beaches","name":"Southern Beaches","kind":"Destination","region":"Galle · Unawatuna · Weligama · Mirissa · Tangalle","img":"photo-1519566335946-e6f65f0f4fdf","shot":"Stilt fishermen on the southern reef","text":"A hundred kilometres of coast from a Dutch fort to empty sand, with whales offshore and surf all winter.","lead":"The south is the part of the island that works from November to April, and it packs a walled colonial city, the country’s easiest surf and the best whale watching in Asia into a couple of hours of driving.","body":["Galle Fort is the anchor. The Dutch rebuilt it in 1663 on Portuguese foundations, and the ramparts, the grid of streets and most of the verandahed houses survive — it is a living town, not a museum, with people still in the houses. Walk the walls at sunset, which is when the whole place goes gold and the local kids start jumping off the bastion into the sea.","Going east the beaches get quieter. Unawatuna is busy and shallow; Weligama is the wide sandy bay where most people learn to surf; Mirissa is small and steep and where the whale boats leave from. By Tangalle the crowds have thinned to almost nothing and the beaches run for kilometres with a handful of cabanas on them.","Blue whales pass the southern shelf between roughly December and April, close enough that a boat from Mirissa reaches them in an hour. Go with an operator that keeps its distance and limits its time with an animal; the good ones will tell you this before you ask. Spinner dolphins turn up in pods of hundreds on the same trip.","The stilt fishermen you have seen photographs of are real, but the ones sitting picturesquely at Koggala when a tour bus pulls up are being paid to pose. The genuine article works at dawn and dusk, quietly, and nobody asks you for money."],"facts":[["Best time","Nov–Apr"],["How long","3–5 nights"],["Whales","Dec–Apr from Mirissa"],["Getting there","1.5 hrs from Colombo by expressway"]]},{"slug":"jaffna-and-the-north","name":"Jaffna & the North","kind":"Destination","region":"Jaffna · Point Pedro · Delft · Mannar","img":"photo-1707236606614-fbee3070f156","shot":"Fishing boats on the northern lagoons","text":"Palmyra palms, Tamil temples, an island chain of wild ponies, and a food culture found nowhere else on the island.","lead":"The north was effectively unreachable for most of thirty years, and it is still the part of Sri Lanka that feels least like the rest of it — different language, different religion, different food, flatter and hotter and drier.","body":["Jaffna town is low-rise and spread out, built around the Nallur Kandaswamy Kovil, a Hindu temple whose gopuram you can see from most of the city. The annual festival in July and August runs for twenty-five days and includes chariot processions and acts of penance that draw people from across the Tamil diaspora. Outside festival time it is quiet, and men will be washing at the tank at six in the morning.","The food is the reason a lot of people end up staying longer than planned. Jaffna curry is hotter and more sour than southern Sri Lankan cooking, built on a distinct roasted spice mix, and the crab curry is the dish people travel for. Palmyra — the fan palm that covers the peninsula — turns up as jaggery, as a stiff pudding called odiyal, and as toddy.","The islands west of the city are reached by causeway and ferry. Delft has feral ponies descended from Portuguese stock, a baobab, and coral walls dividing the fields. Kayts and Karainagar are closer and easier. Point Pedro, at the northern tip, is as far north as the country goes.","Some honesty is owed here: the war ended in 2009 and the north carries it visibly, in shelled buildings, in war memorials that not everyone agrees about, and in families who are still looking for people. Travel here with that in mind. Ask before photographing, and let people raise the subject rather than raising it yourself."],"facts":[["Best time","Dec–Mar; Jul–Aug for Nallur"],["How long","2–3 nights"],["Getting there","7 hrs by train from Colombo"],["Note","Very hot Apr–Aug"]]},{"slug":"east-coast","name":"East Coast","kind":"Destination","region":"Trincomalee · Nilaveli · Pasikudah · Arugam Bay","img":"photo-1646894232861-a0ad84f1ad5d","shot":"An aerial view of a palm-fringed beach","text":"The coast that works when the south is under rain: flat warm water from May to September, and the best surf point in the country.","lead":"Sri Lanka has two monsoons pulling in opposite directions, which means there is always a good coast. From May to September it is this one.","body":["Trincomalee has one of the finest natural deep-water harbours in the world, which is why everyone from the Portuguese to the Royal Navy wanted it. Koneswaram temple sits on the cliff at Swami Rock above a 130-metre drop, and there is a wooden pillar on the edge where a Dutch girl is said to have thrown herself into the sea in 1687 — the story is probably invented, the view is not.","Nilaveli and Uppuveli are the beaches, fifteen and five kilometres north, wide and shallow and largely empty midweek. Pigeon Island is a twenty-minute boat ride offshore and one of only two marine national parks in the country: living coral, reef sharks and turtles in three metres of water. Numbers are capped, so go on the first boat.","Pasikudah, further south, is a shallow bay you can wade out into for several hundred metres — good for small children and hopeless for surfing. Batticaloa beyond it has lagoons, a Dutch fort and the singing-fish story, which locals will happily tell you and then decline to explain.","Arugam Bay is the other end of the coast and a different proposition entirely: a long right-hand point break that works from May to September and draws surfers from everywhere. The village is barefoot and cheap. Twenty minutes south, Panama and Kumana National Park have the same coast with almost none of the people."],"facts":[["Best time","May–Sep"],["How long","3–4 nights"],["Surf","Arugam Bay, May–Sep"],["Getting there","6 hrs from Colombo to Trincomalee"]]},{"slug":"wildlife-and-safari","name":"Wildlife & Safari","kind":"Experience","region":"Yala · Wilpattu · Udawalawe · Minneriya · Sinharaja","img":"photo-1571406761758-9a3eed5338ef","shot":"Wild elephants in the dry-zone scrub","text":"Leopards, sloth bears, blue whales and 6,000 wild elephants, on an island the size of Ireland.","lead":"Sri Lanka packs more large mammals into 65,000 square kilometres than almost anywhere, and you can see elephants at breakfast and whales after lunch without a domestic flight.","body":["The leopards are the headline. Sri Lankan leopards are a distinct subspecies and, unusually, the apex predator here — there are no lions or tigers to hide from — so they behave boldly and hunt by day. Yala Block 1 has one of the highest recorded densities anywhere. Wilpattu has fewer sightings and a tenth of the jeeps, which many people end up preferring.","Elephants are close to guaranteed. Around 6,000 live wild on the island, and Udawalawe’s open scrub makes a blank half-day almost impossible. From roughly July to October, several hundred gather on the drying bed of the Minneriya tank — the largest congregation of wild Asian elephants on earth, and worth planning a trip around.","Offshore, blue whales pass the southern shelf between December and April and the eastern coast from May to September. They come close enough that a Mirissa boat reaches them inside an hour. Sperm whales and pods of several hundred spinner dolphins turn up on the same trips.","For birds, Sinharaja rainforest and the Bundala wetlands are the two to know: 95 per cent of the island’s endemic bird species occur in Sinharaja, and Bundala fills with flamingos between September and March.","On ethics, we will say this plainly. We do not book elephant rides, elephant bathing, or any operator whose drivers crowd, chase or corner an animal for a photograph. If your driver offers to get closer for a tip, please say no — and tell us, because we will stop using them."],"facts":[["Best time","Feb–Jul south; May–Sep east"],["Drives","Dawn and late afternoon"],["How long","2–3 park days in a fortnight"],["We will not book","Rides, bathing, or crowding an animal"]]},{"slug":"train-journeys","name":"Train Journeys","kind":"Experience","region":"Kandy–Ella · Colombo–Jaffna · the coast line","img":"photo-1566296314736-6eaac1ca0cb9","shot":"The blue train on the Nine Arch Bridge","text":"A colonial-era network that happens to run through tea estates, cloud forest and along the surf.","lead":"The Kandy to Ella line is routinely called one of the great train rides in the world, and for once the claim survives contact with the actual journey.","body":["The line was built to bring tea down from the hills and climbs to over 1,890 metres at Pattipola, the highest station in the country. The whole run takes six to seven hours; the section between Nanu Oya and Ella, roughly the last two and a half, is the part everyone photographs — tea terraces, waterfalls, and the train crawling slowly enough for people to hang out of the doorways.","Booking matters. First-class observation seats and second-class reserved sell out weeks ahead in season and can be booked online through the railway or an agent. Second-class unreserved cannot be booked, is cheap, and is standing room by Peradeniya — which is how a lot of people end up in the doorway with their legs out, and honestly it is the better photograph.","The coastal line from Colombo south to Galle and Matara runs so close to the water that spray reaches the windows. It is slow, local and costs almost nothing. The northern line to Jaffna reopened in 2014 after twenty-four years, and the overnight sleeper is a genuinely comfortable way to cover the length of the island.","Two practical notes: trains here run late, sometimes by hours, so never put a flight on the same day as a long rail leg. And the doorways are open by design, with no barriers — the photographs everyone wants are taken leaning out of a moving train, and people are injured doing it every year. Hold on properly, and keep back on the bridges."],"facts":[["The ride","Kandy–Ella, 6–7 hrs"],["Book","Reserved seats weeks ahead"],["Best light","Morning departures"],["Cost","A few dollars, any class"]]},{"slug":"tea-trails-and-hiking","name":"Tea Trails & Hiking","kind":"Experience","region":"Nuwara Eliya · Hatton · Haputale · Knuckles · Sri Pada","img":"photo-1713015702343-b91707c04bc7","shot":"A hill covered in green tea bushes","text":"Estate paths, cloud forest ridges and a pilgrimage up five thousand steps in the dark.","lead":"Above about a thousand metres the island turns into something else entirely — cool, green, quilted with tea, and threaded with paths that plantation workers have used for a century and a half.","body":["The Pekoe Trail, completed in stages and now running some 300 kilometres across the hill country in 22 stages, is the most ambitious thing to happen to walking in Sri Lanka. You can do a day of it or a fortnight, staying in estate bungalows and small guesthouses between stages. The sections around Haputale and Ella are the most scenic; the ones near Kandy are the gentlest.","Horton Plains is the classic day walk: nine and a half kilometres across montane grassland and cloud forest to World’s End, an 870-metre drop. Start at 6am, because the view is gone under cloud by mid-morning. It is genuinely cold up there, which surprises people who packed for the tropics.","The Knuckles range is the wilder option — a UNESCO-listed massif of cloud forest, cardamom and villages where the trails are unmarked and a guide is essential rather than optional. Two- and three-day traverses are possible, staying in village homes.","Adam’s Peak, or Sri Pada, is the one that is not really a hike. Five thousand steps through the night to reach the summit before dawn, alongside pilgrims of four religions, to see the peak throw a perfect triangular shadow across the plain as the sun comes up. The season runs from the December full moon to Vesak in May; outside it, the path is unlit and the summit temple closed.","Anywhere here, take a fleece and a rain shell. The hills make their own weather and a bright morning in Nuwara Eliya has no bearing on the afternoon."],"facts":[["Best time","Jan–Mar for clear mornings"],["Sri Pada","Dec full moon – May"],["Guide needed","Knuckles, yes; Horton Plains, no"],["Pack","Fleece, rain shell, head torch"]]},{"slug":"surf-and-diving","name":"Surf & Diving","kind":"Experience","region":"Weligama · Arugam Bay · Hikkaduwa · Pigeon Island · Kalpitiya","img":"photo-1569670380685-4582bf29a24a","shot":"Coconut palms above the surf coast","text":"Two monsoons, two coasts, and surf somewhere on the island every month of the year.","lead":"The great convenience of Sri Lanka is that the weather is always good somewhere: the south works November to April, the east May to September, and you simply move.","body":["Weligama is where most people stand up for the first time. A wide bay, a sand bottom rather than reef, and waves that reform gently all the way in, which means falling off costs you nothing worse than a mouthful of seawater. Boards and instructors line the beach and a two-hour lesson is inexpensive. Midigama, ten minutes west, is the step up — Lazy Left, Rams and Plantations all break over shallow coral.","Arugam Bay on the east coast is the serious one: a long, mechanical right-hand point that peels for a couple of hundred metres and draws surfers from around the world between May and September. Whiskey Point and Peanut Farm nearby take the overflow, and Panama further south takes almost nobody.","Underwater, Pigeon Island off Nilaveli is one of only two marine national parks in the country — living coral, blacktip reef sharks in the shallows and turtles, in three metres of clear water. Numbers on the island are capped, so take the first boat. Hikkaduwa on the west has a shallow coral sanctuary and a scattering of wrecks for qualified divers.","Kalpitiya, on the north-west lagoon, is the kitesurfing base: flat waist-deep water and reliable wind from May to October, plus dolphins offshore in the mornings. It is a two-and-a-half hour drive from the airport, which makes it an easy first or last stop."],"facts":[["South coast","Nov–Apr"],["East coast","May–Sep"],["Beginners","Weligama, sand bottom"],["Diving","Pigeon Island, first boat"]]},{"slug":"ayurveda-and-wellness","name":"Ayurveda & Wellness","kind":"Experience","region":"Beruwala · Bentota · Wadduwa · the hill country","img":"photo-1588598198321-9735fd52455b","shot":"Forested mountain ridges in the hill country","text":"A three-thousand-year-old medical tradition that is still taught at university here, and still practised properly.","lead":"Ayurveda in Sri Lanka is not a spa menu. It is a licensed medical system with its own degree courses and government hospitals, and the good centres will treat you as a patient rather than a guest.","body":["A genuine programme begins with a consultation: a physician takes your pulse, asks a long list of questions and works out your constitution and imbalance before anything is prescribed. Treatments then follow a plan — herbal oils, steam, specific diets, and daily therapies at set times. Panchakarma, the full detoxification programme, properly takes fourteen to twenty-one days. A three-day version is a massage holiday, which is fine, but it is not the same thing.","Expect the diet to change. Most residential programmes are vegetarian, low in salt and sugar, and served warm; caffeine and alcohol usually go. People find the first two days harder than any of the treatments.","The classic centres cluster on the west coast between Wadduwa and Bentota, close to the airport and to the sea. The hill country alternative trades the beach for cool air and quiet, which suits some people better for a long programme.","A note on choosing: look for a resident physician with a recognised Ayurveda degree, a written treatment plan, and a centre that asks about your medical history and current medication before you arrive. If nobody asks what you are taking, it is a spa. Ayurvedic treatment can interact with prescription drugs, so tell your own doctor what you are planning."],"facts":[["Proper programme","14–21 days"],["Short version","7 days minimum to feel it"],["Where","Wadduwa to Bentota, or the hills"],["Ask for","A resident, degree-qualified physician"]]},{"slug":"food-and-cooking","name":"Food & Cooking","kind":"Experience","region":"Colombo · Galle · Jaffna · Kandy","img":"photo-1743525700011-afac212694d7","shot":"A variety of curry dishes","text":"Rice and curry is not one dish but a table of eight, and every region of the island builds it differently.","lead":"Sri Lankan food is its own tradition, not a regional variant of Indian cooking — hotter, more sour, heavier on coconut, and built around a spread rather than a single plate.","body":["A proper rice and curry arrives as rice plus five to eight small dishes: a protein, several vegetables, a dhal, a sambol and a papadam, eaten together in combinations you assemble yourself. The coconut is what makes it taste Sri Lankan — fresh milk in the curries, scraped flesh in the sambols, and oil to cook it all in.","Breakfast is the meal people fall in love with. Hoppers, bowl-shaped fermented rice-flour pancakes, crisp at the edge and soft in the middle, with an egg cracked into the base. String hoppers, steamed nests of rice noodles, eaten with dhal and coconut sambol. Kiribath, rice cooked in coconut milk and cut into diamonds, for anything worth celebrating.","The regions genuinely differ. Jaffna cooking in the north is hotter and more sour, built on its own roasted spice blend, and the crab curry is worth the drive. The south leans on fish and coconut. Kandy and the hills are milder and more vegetable-heavy. Colombo has everything, plus the short eats and kottu of a street food culture that runs late.","Cooking classes are widespread and vary enormously. The ones worth doing start at a market, cover why the spices are tempered in a particular order, and let you scrape your own coconut. We can arrange a class in a family home rather than a hotel kitchen, which is a different afternoon entirely.","On heat: yes, it is spicy, and asking for it mild is completely normal. Vegetarians eat extremely well here — many of the dishes on any table are vegetable by default — and vegans need only ask about maldive fish, a dried tuna flake that finds its way into sambols."],"facts":[["Do not miss","Hoppers for breakfast"],["Regional peak","Jaffna crab curry"],["Classes","Ask for a home, not a hotel"],["Vegetarians","Very well served"]]},{"slug":"weddings-and-honeymoons","name":"Weddings & Honeymoons","kind":"Experience","region":"Galle · Bentota · the hill country · the east coast","img":"photo-1646894232861-a0ad84f1ad5d","shot":"An aerial view of a palm-fringed beach","text":"Fort ramparts, tea bungalows and empty beaches, with the paperwork handled properly.","lead":"Sri Lanka is an easy place to marry as a foreign couple, and an unusually good one to honeymoon in, because you can have a beach, a rainforest and a cold night in the hills inside a week.","body":["For the ceremony itself, the three settings people keep choosing are a Galle Fort courtyard or rampart at sunset, a planter’s bungalow lawn in the tea country with the hills behind, and a private stretch of southern or eastern beach. All three photograph beautifully and all three come with a weather season you need to plan around.","On the legal side: foreign couples can marry in Sri Lanka, and the registration is straightforward, but it needs documents prepared before you fly — passports, birth certificates, and evidence of the end of any previous marriage, some of which may need translation or apostille. Requirements change and depend on your home country, so treat this as the thing to confirm first, with your own registrar as well as with us.","For honeymoons, the pattern that works is three moves rather than one: a few nights in the hills for cool air and walking, a few in a park for the wildlife, and finish on the coast doing nothing. Trying to see the whole island on a honeymoon is the most common mistake and it turns a holiday into a driving schedule.","Ceremonies are often paired with a Poruwa, the traditional Sinhalese ritual on a decorated platform, complete with drummers and Kandyan dancers. It is genuinely lovely, and it belongs to a living culture — we will help you do it with people who practise it rather than perform it."],"facts":[["Best months","Dec–Mar south; May–Sep east"],["Paperwork","Start 3 months ahead"],["Honeymoon shape","Hills, park, then coast"],["Ceremony","Civil, or civil plus Poruwa"]]}];
const IMG = (id, w) => `https://images.unsplash.com/${id}?fm=jpg&q=80&w=${w}&auto=format&fit=crop`;
const pic = (d, w) => d.art ? d.art : IMG(d.img, w);
const slug = new URLSearchParams(location.search).get('g');
const d = ALL.find(x => x.slug === slug);
const main = document.getElementById('main');

if (!d){
  main.innerHTML = `<div class="wrap miss">
    <h1 style="font-size:1.6rem;font-weight:800;text-transform:uppercase">Guide not found</h1>
    <p style="margin-top:.8rem;color:rgba(30,42,34,.6);font-weight:300">Try one of the guides below.</p></div>`;
} else {
  document.title = d.name + ' — TripzaCeylon';
  main.innerHTML = `
    <div class="hero">
      <img src="${pic(d, 2000)}" alt="${d.shot}">
      <div class="veil"></div>
      <div class="in"><div class="wrap">
        <span class="chip">${d.region}</span>
        <h1>${d.name}</h1>
      </div></div>
    </div>
    <div class="wrap layout">
      <div>
        <p class="lead">${d.lead}</p>
        <div class="body">${d.body.map(p => `<p>${p}</p>`).join('')}</div>
        <p class="shot">Photograph: ${d.shot}</p>
      </div>
      <aside class="facts">
        <h3>At a glance</h3>
        <dl>${d.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
        <a class="btn" href="build-your-trip.html#enquire">Enquire about this
          <svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7v-5H4v-4h9V5Z"/></svg></a>
        <a class="btn ghost" href="build-your-trip.html">Add it to a route</a>
      </aside>
    </div>`;
}

/* ---------- five more, as cards ---------- */
const pool = ALL.filter(x => x.slug !== slug);
const PICK = [];
for (let i = 0; i < 5 && pool.length; i++) PICK.push(pool.splice(Math.floor(i * pool.length / 5), 1)[0]);

document.getElementById('grid').innerHTML = PICK.map(x => `
  <a class="mcard" href="guide.html?g=${x.slug}">
    <div class="pic"><img loading="lazy" src="${pic(x, 700)}" alt="${x.shot}"></div>
    <div class="txt">
      <h4>${x.name}</h4>
      <span class="reg">${x.region}</span>
      <p>${x.text}</p>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7v-5H4v-4h9V5Z"/></svg></span>
    </div>
  </a>`).join('');
</script>
