<style>
:root{
  --deep:#1a2c22;--ocean:#2f4b3a;--teal:#4f7457;--leaf:#5f855f;--lime:#bfd3ae;
  --ink:#1e2a22;--muted:#6a7a6c;--line:rgba(47,75,58,.16);
  --grad:linear-gradient(120deg,var(--ocean),var(--teal) 55%,var(--leaf));
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;color:var(--ink);background:#fcfdfa;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{width:min(1180px,92vw);margin:0 auto}

/* ---- nav ---- */
header{background:var(--deep);padding:1rem 0;position:sticky;top:0;z-index:50}
.nav{display:flex;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;font-family:'Pacifico',cursive;font-size:1.3rem;color:#fff;padding-top:.15rem}
.logo .mark{height:56px;width:auto;flex:0 0 auto;border-radius:0;object-fit:contain;background:none}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;color:rgba(255,255,255,.8);
  font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:.3s}
.back:hover{color:#fff}
.back svg{width:14px;height:14px;fill:currentColor}

/* ---- hero ---- */
.hero{position:relative;height:min(58vh,460px);overflow:hidden;background:var(--deep)}
.hero img{filter:saturate(.72) contrast(.97)}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(26,44,34,.95) 6%,rgba(26,44,34,.4) 55%,rgba(26,44,34,.2))}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding-bottom:2.4rem;color:#fff}
.chip{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:.42rem .9rem;border-radius:99px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);margin-bottom:1rem}
.hero h1{font-weight:800;text-transform:uppercase;font-size:clamp(2rem,5.4vw,3.6rem);
  line-height:.98;letter-spacing:-.035em}

/* ---- article ---- */
.layout{display:grid;grid-template-columns:1.4fr .6fr;gap:3.4rem;align-items:start;padding:3.4rem 0 4.5rem}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:2rem}}
.lead{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(1.15rem,2.1vw,1.5rem);
  line-height:1.5;color:var(--ocean);margin-bottom:1.8rem}
.body p{font-weight:300;font-size:1rem;line-height:1.95;color:rgba(30,42,34,.8);margin-bottom:1.15rem;max-width:38rem}
.shot{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,42,34,.4);
  font-weight:500;margin-top:1.6rem}
.facts{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.5rem 1.4rem;position:sticky;top:5.2rem}
@media(max-width:900px){.facts{position:static}}
.facts h3{font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.18em;color:var(--leaf);margin-bottom:1rem}
.facts dl{display:grid;gap:.85rem}
.facts dt{font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(30,42,34,.42)}
.facts dd{font-size:.86rem;font-weight:400;line-height:1.55;color:var(--ink);margin-top:.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;width:100%;border:0;
  cursor:pointer;padding:.9rem 1.3rem;border-radius:99px;font-family:inherit;font-size:.8rem;
  font-weight:600;background:var(--grad);color:#fff;transition:.3s;margin-top:1.4rem;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);margin-top:.55rem}
.btn.ghost:hover{background:#f4f7f2;transform:none}
.btn svg{width:15px;height:15px;fill:currentColor}

/* ---- five more: cards in a row, same design as the map card on the home page ---- */
#more{background:#f4f7f2;padding:4.5rem 0 5.5rem;border-top:1px solid var(--line)}
#more .eyebrow{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--leaf)}
#more h2{font-weight:800;text-transform:uppercase;font-size:clamp(1.5rem,3vw,2.1rem);
  line-height:1.05;letter-spacing:-.03em;margin-top:.7rem}
.more-head{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;
  flex-wrap:wrap;margin-bottom:2.2rem}
.pill{display:inline-flex;align-items:center;gap:.9rem;padding:.34rem .34rem .34rem 1.35rem;
  border:1px solid rgba(17,28,22,.16);border-radius:99px;background:#fff;
  font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);transition:.3s;white-space:nowrap}
.pill i{width:34px;height:34px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;flex:0 0 auto}
.pill i svg{width:14px;height:14px;fill:#fff}
.pill:hover{background:#fff;border-color:var(--leaf)}

.more-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.1rem;align-items:start}
@media(max-width:1100px){.more-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.more-grid{grid-template-columns:repeat(2,1fr);gap:.8rem}}
@media(max-width:460px){.more-grid{grid-template-columns:1fr}}

.mcard{
  display:block;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 20px 50px -34px rgba(17,28,22,.45);transition:transform .3s,box-shadow .3s,border-color .3s;
}
.mcard:hover{transform:translateY(-5px);box-shadow:0 26px 54px -28px rgba(17,28,22,.5);border-color:transparent}
.mcard .pic{aspect-ratio:4/3;position:relative;overflow:hidden;background:#eceee9}
.mcard .pic img{filter:saturate(.72) contrast(.97);transition:transform 6s ease}
.mcard:hover .pic img{transform:scale(1.05)}
.mcard .txt{padding:1.15rem 1.2rem 1.35rem}
.mcard h4{font-weight:700;text-transform:uppercase;font-size:.94rem;letter-spacing:-.01em;line-height:1.2;color:var(--ink)}
.mcard .reg{display:block;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(17,28,22,.4);font-weight:500;margin:.4rem 0 .65rem}
.mcard p{font-weight:300;font-size:.8rem;line-height:1.7;color:rgba(17,28,22,.68)}
.mcard .go{margin-top:.95rem;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;transition:.3s}
.mcard:hover .go{background:var(--leaf);border-color:var(--leaf)}
.mcard .go svg{width:14px;height:14px;fill:var(--ink);transition:.3s}
.mcard:hover .go svg{fill:#fff}

footer{background:#16241c;color:rgba(255,255,255,.5);font-size:.76rem;padding:1.6rem 0;text-align:center}
footer a{color:rgba(255,255,255,.75)}
.miss{padding:5rem 0;text-align:center}

/* ---- floating contact ---- */
.fab{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:1100;display:flex;flex-direction:column;gap:.6rem}
.fab-btn{display:flex;align-items:center;justify-content:flex-end;width:52px;height:52px;border-radius:99px;
  overflow:hidden;color:#fff;box-shadow:0 10px 26px -8px rgba(10,20,14,.5);
  transition:width .32s cubic-bezier(.2,.85,.25,1),box-shadow .3s;animation:fabIn .6s ease backwards}
.fab-btn.wa{background:#25d366;animation-delay:.3s}
.fab-btn.ig{background:linear-gradient(45deg,#f9a03f 0%,#d6266b 48%,#8a3ab9 100%);animation-delay:.6s}
.fab-btn.fb{background:#1877f2;animation-delay:.75s}
.fab-btn.em{background:#3d6047;animation-delay:.45s}
@keyframes fabIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.fab-btn svg{width:24px;height:24px;fill:currentColor;flex:0 0 auto;margin-right:14px}
.fab-lab{font-size:.74rem;font-weight:600;white-space:nowrap;opacity:0;padding-left:16px;transition:opacity .22s}
.fab-btn:hover{width:168px}
.fab-btn:hover .fab-lab{opacity:1}
@media(max-width:700px){
  .fab{right:12px;top:auto;bottom:14px;transform:none;flex-direction:column-reverse}
  .fab-btn,.fab-btn:hover{width:46px}.fab-btn{height:46px}
  .fab-btn svg{width:21px;height:21px;margin-right:12.5px}.fab-lab{display:none}
}
</style>

<script>
const ALL = [{"slug":"jaffna","name":"Jaffna","x":1159.9,"y":704.6,"region":"Northern Province","text":"Palmyra palms, the Nallur Kandaswamy temple and a Tamil food culture found nowhere else on the island.","img":"photo-1707236606614-fbee3070f156","shot":"Fishing boats on the northern lagoons","lead":"The northern capital, cut off for thirty years, and unlike anywhere else on the island in language, food and faith.","body":["Jaffna was effectively unreachable for most of the civil war and has been open again only since 2009. What that isolation preserved is a Tamil culture with its own rhythm: Nallur Kandaswamy Kovil at the centre of it, gold-towered and enormous, hosting a 25-day festival each summer that draws pilgrims from across the diaspora.","The food alone justifies the trip. Jaffna crab curry is built on a roasted spice mix that is darker and hotter than anything in the south, and odiyal kool — a seafood broth thickened with palmyra root flour — exists nowhere else. The palmyra palm shapes everything here: timber, thatch, fibre, jaggery, toddy.","The peninsula runs out into islands connected by causeways, flat and bright and salt-scoured, ending at Delft with its wild ponies and coral-block walls. It is a long drive north from Colombo, about six hours on the A9, and the landscape changes completely on the way."],"facts":[["Best time","Jul–Aug for the Nallur festival"],["How long","Two or three nights"],["Season","Driest Feb–Sep"],["Nearby","Delft and the islands, by causeway and ferry"],["Note","Six hours by road from Colombo — fly or break the drive"]]},{"slug":"trincomalee","name":"Trincomalee","x":4375.3,"y":3629.6,"region":"East Coast","text":"One of the world’s finest natural harbours, with Koneswaram temple on the cliff and whales offshore in season.","img":"photo-1646894232861-a0ad84f1ad5d","shot":"A palm-backed bay on the east coast","lead":"One of the finest natural deep-water harbours in the world, fought over for four centuries, now mostly quiet.","body":["The harbour is the reason for everything here. It is deep enough for anything afloat and sheltered enough to sit out a cyclone, which is why the Portuguese, Dutch, French and British all took it in turn, and why Nelson called it the finest harbour in the world when he was a young man stationed there.","Koneswaram temple sits on Swami Rock at the harbour mouth, a Hindu site older than most records, destroyed by the Portuguese in 1622 and rebuilt in the 1950s when divers recovered the original lingam from the seabed. The cliff below it drops straight into the water.","The beaches are north of town at Uppuveli and Nilaveli, and the season is the mirror of the south coast: May to September, when the west is under monsoon. Pigeon Island lies a short boat ride offshore with living coral and blacktip reef sharks in the shallows. Blue whales pass through between May and October."],"facts":[["Best time","May–Sep, when the south is wet"],["How long","Two or three nights"],["Season","Whales May–Oct"],["Nearby","Pigeon Island, 20 minutes by boat"],["Note","Cover up at Koneswaram — it is an active temple"]]},{"slug":"sigiriya","name":"Sigiriya","x":3145.8,"y":5346.3,"region":"Cultural Triangle","text":"A 200-metre granite monolith that a 5th-century king turned into a palace in the sky.","img":"photo-1612862862126-865765df2ded","shot":"Sigiriya rock rising from the plain","lead":"A 5th-century king built his palace on top of a 200-metre plug of hardened magma, and then someone spent a thousand years arguing about why.","body":["Kasyapa took the throne in 477 CE by walling his father up alive, and spent the next eighteen years on a rock in the middle of the dry zone, ringed by moats and ramparts, waiting for the brother who would eventually come for him. What he left behind is the most complete surviving example of an ancient urban plan anywhere in South Asia — water gardens, boulder gardens and terraced gardens climbing towards a summit palace, all laid out on a single axis.","The climb is 1,200 steps and takes most people two hours with stops. Halfway up, a sheltered pocket of rock holds the frescoes: women in ochre and green, painted with a confidence that still startles. Below them runs the mirror wall, once polished bright enough to reflect them, now covered in graffiti left by visitors between the 8th and 10th centuries — some of the earliest tourist reviews on record, and mostly about the women.","Go at 6:30am when the gates open. By nine the steel staircases hold queues, the rock radiates heat, and the hornets that live in the overhangs get irritable. From the summit at first light the whole dry-zone plain opens out, tanks glinting, and Pidurangala watching from across the gap."],"facts":[["Best time","6:30am, at opening"],["How long","2–3 hours to climb and descend"],["Season","Any, but Feb–Sep is driest"],["Nearby","Dambulla cave temples, 20 minutes"],["Note","Steep, exposed metal stairways — not for vertigo"]]},{"slug":"batticaloa","name":"Batticaloa","x":5665.0,"y":6018.4,"region":"East Coast","text":"Lagoons, a Dutch fort and the singing-fish legend, on a coast that peaks from May to September.","img":"photo-1580910527739-556eb89f9d65","shot":"Palms along the eastern shore","lead":"Lagoon country on the east coast, a Dutch fort, and fish that are supposed to sing.","body":["Batticaloa sits on a lagoon so large the town is effectively built on islands, joined by bridges. The Dutch fort from 1628 still stands at the centre, small and square and largely ignored, and the whole place moves at a pace that makes Colombo feel frantic.","The singing fish are a genuine local phenomenon and a genuine mystery: on still nights near Kallady Bridge, particularly around a full moon, a faint musical humming rises from the water. Fishermen have reported it for centuries. Theories run from catfish to shrimp to air escaping molluscs, and no one has settled it.","The beaches here — Kallady, Pasikudah, Kalkudah — are shallow, warm and empty compared with the south, and the season runs May to September. Pasikudah bay is so gradual you can wade out two hundred metres."],"facts":[["Best time","May–Sep"],["How long","Two nights"],["Season","Singing fish reported on full-moon nights"],["Nearby","Pasikudah bay, 35 minutes north"],["Note","Very quiet — this is not a nightlife coast"]]},{"slug":"kandy","name":"Kandy","x":2803.7,"y":7161.1,"region":"Central Highlands","text":"The last royal capital, wrapped around a lake, with the Temple of the Sacred Tooth Relic at its heart.","img":"photo-1665849050430-5e8c16bacf7e","shot":"The Temple of the Sacred Tooth Relic","lead":"The last kingdom to fall, wrapped around a lake the last king dug himself, still holding the tooth that legitimises whoever holds it.","body":["Kandy held out against the Portuguese, the Dutch and then the British until 1815, protected by a ring of hills and a reputation for malaria. That isolation is why so much survived here — the dance forms, the drumming, the craft guilds, and the Temple of the Sacred Tooth Relic, which has housed the Buddha's tooth since the 16th century and has been rebuilt every time someone tried to destroy it.","The temple runs three pujas a day, at dawn, midday and evening, each announced by drummers in the courtyard. The relic itself is never displayed — you file past a gilded casket inside a chamber, and that is the point. Dress covers shoulders and knees; shoes come off at the gate.","The lake was built in 1807 by Sri Wickrama Rajasinghe, the final king, and cost him what remained of his popularity. Walk it in the hour before sunset when the light goes gold on the water and the fruit bats leave the trees along the far bank in a stream that takes twenty minutes to pass."],"facts":[["Best time","Evening puja, around 6:30pm"],["How long","Two nights"],["Season","Cool year-round; Jul–Aug for the Perahera"],["Nearby","Peradeniya Botanical Gardens, 20 minutes"],["Note","Shoulders and knees covered inside the temple"]]},{"slug":"colombo","name":"Colombo","x":715.9,"y":8151.0,"region":"West Coast","text":"The island’s restless capital — colonial arcades, Galle Face sunsets and the best eating in the country.","img":"photo-1623595289196-007a22dd8560","shot":"The Lotus Tower, Colombo","lead":"Not a place most itineraries linger, which is a mistake — the eating alone is worth two days.","body":["Colombo is a working port city that happens to have a beach promenade, and it does not perform for visitors, which is precisely its appeal. The Pettah market district is chaos organised by street — one for electronics, one for textiles, one for spices — and the Dutch Hospital, the oldest building in the city, is now a courtyard of restaurants and bars.","Galle Face Green fills every evening with kite-sellers, isso wade carts and families walking the seafront. It is the single best hour in the city. Behind it, Colombo 7 holds the tree-lined streets, the museum and the Gangaramaya temple, which is part monastery, part museum, part hoard.","Eat here. Ministry of Crab, Upali's for the old Sinhalese dishes, the hopper stalls on Galle Road after dark, and the short-eats counters in any bakery at four in the afternoon. Nothing you eat further south will be better than what you can find in Colombo."],"facts":[["Best time","Galle Face at sunset"],["How long","One or two nights"],["Season","Year-round; Nov–Apr driest"],["Nearby","Negombo and the airport, 40 minutes north"],["Note","Traffic is severe 7–9am and 4–7pm"]]},{"slug":"nuwara-eliya","name":"Nuwara Eliya","x":3223.7,"y":8089.4,"region":"Tea Country","text":"Cool air at 1,868 metres, hillsides quilted in tea, and the strangest lovely hangover of British Ceylon.","img":"photo-1713015702343-b91707c04bc7","shot":"A hill covered in green tea bushes","lead":"The British built a hill station here because it reminded them of home, and then would not let it go.","body":["At 1,868 metres the air is cold enough for log fires, and the colonial establishment responded by building mock-Tudor houses, a golf course, a racecourse and a gentlemen's club, then calling the whole thing Little England. It is the strangest and loveliest hangover of British Ceylon, and the hedges are still clipped.","The reason for any of it is tea. James Taylor planted the first commercial crop at Loolecondera in 1867, and within thirty years the hills had been stripped and quilted with it. The estates still work: walk a plucking field with the women who do it, then drink the estate's own leaf at altitude, where it tastes different than it does anywhere else.","Horton Plains is an hour away — a high plateau of cloud forest and grassland ending abruptly at World's End, a 870-metre drop. Start at dawn; by ten the cloud comes in and there is nothing to see at all."],"facts":[["Best time","Dec–Mar, coldest and clearest"],["How long","One or two nights"],["Season","Apr for the racing season"],["Nearby","Horton Plains and World's End, 1 hour"],["Note","Genuinely cold at night — bring layers"]]},{"slug":"ella","name":"Ella","x":3919.6,"y":8315.4,"region":"Hill Country","text":"The Nine Arch Bridge, Little Adam’s Peak, and the finest train ride in Asia arriving twice a day.","img":"photo-1566296314736-6eaac1ca0cb9","shot":"The blue train on the Nine Arch Bridge","lead":"A hill town that exists because the railway arrived, and now exists mostly because of what you can see from it.","body":["Ella sits in a gap in the escarpment, and on a clear morning you can see through that gap all the way to the south coast, eighty kilometres away. The town itself is one street of guesthouses and roti shops, and nobody pretends otherwise. What brings people is the walking.","The Nine Arch Bridge is a 30-metre viaduct built entirely of stone and brick — the story that it went up without steel during a wartime shortage is probably apocryphal but has outlived the correction. Trains cross it several times a day, and the walk along the track from Ella town takes about 25 minutes through tea and jungle.","Little Adam's Peak is an easy hour up for tea-covered ridges in every direction. Ella Rock is harder, three hours, and the path is unmarked in places — take a guide or you will end up somewhere else, as many do. The Kandy–Ella train that gets you here is the best rail journey in Asia; book the reserved observation seats weeks ahead."],"facts":[["Best time","Train crosses around 9:30am"],["How long","Two nights"],["Season","Dec–Mar clearest"],["Nearby","Ravana Falls and the zipline, 10 minutes"],["Note","Ella Rock is unmarked — go with a guide"]]},{"slug":"arugam-bay","name":"Arugam Bay","x":6047.5,"y":8387.1,"region":"East Coast","text":"A long right-hand point break and a barefoot village that fills up from May to September.","img":"photo-1569670380685-4582bf29a24a","shot":"Coconut palms above the surf coast","lead":"A long right-hand point break, one sand street, and a season that fills it and then empties it completely.","body":["Main Point is the reason anyone comes: a right-hander that peels for several hundred metres over sand and rock when the swell is running, consistent enough to have been on the world surfing circuit. Around it are Whiskey Point, Peanut Farm and Elephant Rock, each with a different level of forgiveness for beginners.","The village is one road of guesthouses, board rentals and cafés, and it runs on a strict calendar. From May to September it is full and awake. From November to March the swell dies, the rain arrives, and much of it shuts entirely — arriving in December is a mistake people make once.","Kumana National Park is just south, quieter than Yala and better for birds, and elephants come down to the lagoon behind the village often enough that the walk back from dinner deserves a torch."],"facts":[["Best time","May–Sep for swell"],["How long","Three nights minimum"],["Season","Largely closed Nov–Mar"],["Nearby","Kumana National Park, 45 minutes"],["Note","Wild elephants cross the road at night"]]},{"slug":"yala","name":"Yala","x":5155.8,"y":9660.4,"region":"South East","text":"Among the highest leopard densities on earth, shared with elephants, sloth bears and 200+ birds.","img":"photo-1571406761758-9a3eed5338ef","shot":"Wild elephants in the dry-zone scrub","lead":"Among the highest leopard densities anywhere on earth, in scrub and lagoon country that also holds elephants, sloth bears and crocodiles.","body":["Block One, the section most visitors see, has been studied for decades, and the leopard population there is unusually relaxed about vehicles — which is why sightings are common and why the park gets busy. Sri Lankan leopards are a distinct subspecies and the island's apex predator, so unlike in Africa they behave like it: they hunt in daylight and sleep in the open.","The park is more than its cats. Elephants move through year-round, sloth bears come out for the palu fruit in June and July, and the lagoons hold enough birds — painted storks, spoonbills, a hundred species more — that some people come for those alone and never look for a leopard at all.","Go out at first light in a small vehicle, keep the engine off, and let it come to you. The pressure on drivers to deliver a sighting causes bad behaviour: convoys, radios, vehicles crowding an animal. We only work with operators who keep their distance and stay off the radio."],"facts":[["Best time","5:30am gate, half or full day"],["How long","One or two nights nearby"],["Season","Feb–Jul driest; park often closed in Sep"],["Nearby","Kataragama temple town, 30 minutes"],["Note","We do not do convoy safaris — small vehicles only"]]},{"slug":"galle","name":"Galle","x":1688.3,"y":10529.9,"region":"South Coast","text":"A walled Dutch port city of ramparts and verandahs, with stilt fishermen on the reef just beyond.","img":"photo-1519566335946-e6f65f0f4fdf","shot":"Stilt fishermen on the southern reef","lead":"A Portuguese port the Dutch rebuilt in stone, still lived in, and the best-preserved colonial fortification in South Asia.","body":["The Dutch took Galle in 1640 and spent the next century turning it into something that could not be taken back — ramparts on three sides, the sea on the fourth, and a street grid inside that has barely moved since. It survived the 2004 tsunami almost intact, which locals will tell you is the ramparts doing what they were built for.","Inside the walls it is a working town, not a museum: 400 houses, a working mosque, a Dutch Reformed church with gravestones set into its floor, and gem dealers who have been there for generations. Recent years have brought boutiques and roasteries, which some think is ruination and others think is the only reason the buildings got restored.","Walk the ramparts at sunset — the whole town does. Local boys throw themselves off the Flag Rock into the water below, which they will offer to do for you for a fee. Beyond the walls, the stilt fishermen sit on their poles at Koggala, mostly for cameras now, but the technique is real and about seventy years old."],"facts":[["Best time","Ramparts at sunset"],["How long","Two nights"],["Season","Dec–Apr on this coast"],["Nearby","Unawatuna and Koggala, 15 minutes"],["Note","The fort is walkable end to end in 25 minutes"]]},{"slug":"mirissa","name":"Mirissa","region":"South Coast","img":"photo-1580910527739-556eb89f9d65","shot":"Palms on the beach shore","text":"Blue whales offshore from December to April, and a bay built for doing very little.","lead":"A fishing bay that became a whale-watching town, and still manages to feel like neither.","body":["The continental shelf drops away close to shore here, which is why the largest animal that has ever lived comes within a couple of hours of the harbour. Blue whales pass between December and April, along with sperm whales, spinner dolphins in their hundreds, and occasionally orca. Boats leave at 6:30am because the sea flattens in the early hours and roughens by ten.","Choose the operator carefully. The rules — stay 100 metres back, never cut across the animal's path, no more than a handful of boats on one sighting — are widely ignored by the cheaper trips, and a chased whale dives and is gone. The good operators cost more and see more.","On land Mirissa is one crescent of sand with a rocky headland at the eastern end, Parrot Rock, that you can climb in five minutes for the view back along the bay. The surf is gentle enough to learn on, and Weligama next door is where most people do."],"facts":[["Best time","Whales Dec–Apr, boats leave 6:30am"],["How long","Three to five nights"],["Season","Dec–Apr on this coast"],["Nearby","Weligama and Galle, 20–40 minutes"],["Note","Pick a licensed operator that keeps its distance"]]},{"slug":"tripza-lagoon-house","name":"Tripza Lagoon House","region":"Negombo · partner stay","img":"photo-1707236606614-fbee3070f156","shot":"Fishing boats on the lagoon","text":"Ten rooms on the lagoon, twenty minutes from the airport.","kind":"stay","lead":"Ten rooms on the lagoon, twenty minutes from the airport.","body":["One of the places we book guests into on this coast. Small, independently run, and chosen because we have stayed there ourselves.","Rooms are held on request rather than through a booking engine, so availability moves quickly in season. Tell us your dates and we will check."],"facts":[["Type","Partner stay"],["Where","Negombo"],["Booking","On request, through us"]]},{"slug":"cinnamon-coast-villa","name":"Cinnamon Coast Villa","region":"Bentota · partner stay","img":"photo-1580910527739-556eb89f9d65","shot":"Palms on the beach shore","text":"A restored 1930s villa behind the dunes, with a cook who trained in Galle.","kind":"stay","lead":"A restored 1930s villa behind the dunes, with a cook who trained in Galle.","body":["One of the places we book guests into on this coast. Small, independently run, and chosen because we have stayed there ourselves.","Rooms are held on request rather than through a booking engine, so availability moves quickly in seas tions decide whether it runs — wind, swell, water level or visibility depending on the activity — so we always keep a fallback in the plan for that day."],"facts":[["Type","Adventure activity"],["Where","Knuckles Range"],["Booking","Added to any itinerary"]],"img":"photo-1588598198321-9735fd52455b"},{"slug":"kitesurfing","name":"Kitesurfing","region":"Kappalady, Puttalam lagoon","shot":"Fishing boats on a Sri Lankan lagoon","text":"Flat, waist-deep lagoon water and a season of dependable wind from May to October.","kind":"adventure","lead":"Flat, waist-deep lagoon water and a season of dependable wind from May to October.","body":["We add this to itineraries as a half or full day, with the operator, equipment and insurance arranged in advance.","Conditions decide whether it runs — wind, swell, water level or visibility depending on the activity — so we always keep a fallback in the plan for that day."],"facts":[["Type","Adventure activity"],["Where","Kappalady, Puttalam lagoon"],["Booking","Added to any itinerary"]],"img":"photo-1707236606614-fbee3070f156"},{"slug":"anuradhapura","name":"Anuradhapura","x":2182.1,"y":4381.2,"region":"Cultural Triangle","text":"The first capital, founded in the 4th century BC — dagobas the size of hills, and a fig tree grown from a cutting of the one the Buddha sat under.","img":"photo-1559038331-02f4bae92a3d","shot":"Dry-zone forest, the country around the sacred city","lead":"A city of monasteries and reservoirs that ran for 1,400 years, with the oldest continuously tended tree on earth at the centre of it.","body":["Anuradhapura is spread out — this is not a site you walk end to end. The sacred precinct alone covers about 40 square kilometres, and the great dagobas sit far enough apart that you want a bicycle or a driver between them. Ruwanwelisaya and Jetavanaramaya are the two that stop people; the second was, briefly, the third-tallest structure in the ancient world after the pyramids at Giza.","The Sri Maha Bodhi is the reason many Sri Lankans come. It was planted in 236 BC from a cutting of the Bodhi tree at Bodh Gaya, and it has been guarded ever since, which makes it the oldest tree in the world with a recorded planting date. Come in white, cover your shoulders and knees, and take your shoes off well before the platform."],"facts":[["Best time","Dec–Mar, and early morning year-round"],["How long","A full day, two if you take it slowly"],["Getting there","4 hrs from Colombo, 1.5 from Sigiriya"]]},{"slug":"polonnaruwa","name":"Polonnaruwa","x":3844.5,"y":5391.8,"region":"Cultural Triangle","text":"The second capital, compact enough to cycle in a morning, with the four Gal Vihara Buddhas cut straight out of one granite face.","img":"photo-1571406761758-9a3eed5338ef","shot":"Wild elephants in the dry-zone scrub nearby","lead":"Everything Anuradhapura is not: tight, walkable, and largely 12th century, which means it still stands up rather than lying down.","body":["Polonnaruwa was the capital for barely two hundred years, and most of what survives is the work of one king, Parakramabahu I, who also built the Sea of Parakrama — a reservoir big enough that you cannot see across it. The ruins sit in a neat north-south line, and a bicycle covers them in three or four hours.","The Gal Vihara is the piece people remember: four Buddha figures carved from a single wall of granite, one of them seven metres of reclining stone with a fold in the pillow under the head. Stand at the standing figure for a moment before you photograph it — the crossed arms are unusual and nobody agrees on who it depicts."],"facts":[["Best time","Dec–Mar; start at 7am for the light"],["How long","Half a day by bicycle"],["Getting there","1 hr from Sigiriya, 3.5 from Kandy"]]},{"slug":"dambulla","name":"Dambulla","x":2844.0,"y":5620.3,"region":"Cultural Triangle","text":"Five caves under one overhanging rock, painted end to end and holding 153 Buddhas — the largest cave temple complex in the country.","img":"photo-1559038331-02f4bae92a3d","shot":"Dry-zone forest below the cave temple rock","lead":"A working temple for twenty-two centuries, painted into every hollow of the rock rather than flattened out.","body":["The climb is 350 steps and takes fifteen minutes, with macaques on the handrails who will take a water bottle straight out of your hand. At the top, five caves run along under a single granite overhang. The first holds one 14-metre reclining Buddha cut from the rock; the second is the big one, with murals that follow the natural curve of the ceiling for 2,000 square metres.","It is still an active temple, so shoulders and knees stay covered and shoes come off at the terrace — the stone gets hot by ten, which is another argument for going early. The view back over the plain takes in Sigiriya rock, 17 kilometres away."],"facts":[["Best time","Before 9am, or after 4pm"],["How long","2 hrs including the climb"],["Getting there","20 min from Sigiriya"]]},{"slug":"mannar","name":"Mannar","x":832.6,"y":2557.8,"region":"North West","text":"Baobabs brought by Arab traders, a Portuguese-Dutch fort, and the sandbanks of Adam’s Bridge running off towards India.","img":"photo-1707236606614-fbee3070f156","shot":"Fishing boats on the northern lagoons","lead":"An island joined to the mainland by a causeway, with a landscape that belongs somewhere else entirely.","body":["The baobabs are the surprise. There are several hundred on Mannar island, brought as seed by Arab traders around a thousand years ago, and the largest has a girth of nearly twenty metres. They stand in scrub and salt flats with donkeys wandering underneath, and it looks nothing like the rest of Sri Lanka.","From Talaimannar at the western tip, the sandbanks of Adam’s Bridge run out towards India — thirty kilometres of shoal reportedly walkable until a cyclone broke it in the fifteenth century. Between November and March the lagoons fill with migratory birds, including flamingos in the thousands."],"facts":[["Best time","Nov–Mar for the birds"],["How long","A day, or overnight"],["Getting there","3 hrs from Anuradhapura"]]},{"slug":"horton-plains","name":"Horton Plains","x":3251.5,"y":8493.3,"region":"Tea Country","text":"A high plateau of cloud forest and grassland at 2,100m, and a cliff called World’s End that drops 870 metres in one step.","img":"photo-1588598198321-9735fd52455b","shot":"Forested mountain ridges in the hill country","lead":"Start in the dark. The cliff clouds over by nine or ten most mornings and then there is nothing to see at all.","body":["The loop is nine and a half kilometres and takes three to four hours: montane grassland, then cloud forest hung with lichen, then the escarpment. World’s End is a sheer drop of about 870 metres with the southern plains laid out below it, and on a clear morning you can see the coast eighty kilometres away.","The park opens at 6am and the walk should start then. It is cold enough at that hour to want a fleece — this is one of the few places in Sri Lanka where the temperature drops near freezing overnight. Baker’s Falls sits on the return leg, and sambar deer graze the grassland without much concern for people."],"facts":[["Best time","Jan–Mar, at first light"],["How long","3–4 hrs for the loop"],["Getting there","1.5 hrs from Nuwara Eliya"]]},{"slug":"udawalawe","name":"Udawalawe","x":3492.6,"y":9382.1,"region":"South","text":"The most reliable elephant park in the country — around 600 resident animals, and no real need for luck.","img":"photo-1571406761758-9a3eed5338ef","shot":"Wild elephants in the dry-zone scrub","lead":"Yala has the leopards. Udawalawe has the elephants, in numbers that make a sighting close to a certainty.","body":["The park was created in 1972 to give a home to animals displaced by the Udawalawe reservoir, and the open scrub means you see across it rather than into it. Herds gather at the water through the afternoon, and a half-day drive without elephants is close to unheard of. There are crocodiles, water buffalo and around 200 bird species as well.","The Elephant Transit Home on the park boundary is worth an hour. Orphaned calves are milk-fed there and released back into the park in batches, which is the opposite of the ride-and-bathe operations elsewhere on the island. You watch a feeding from a platform; there is no contact with the animals, which is the point."],"facts":[["Best time","Year-round; afternoons are best"],["How long","A half-day drive"],["Getting there","2 hrs from Ella, 3 from Galle"]]},{"slug":"kataragama","name":"Kataragama","x":4694.5,"y":9540.9,"region":"Deep South","text":"One sanctuary shared by Buddhists, Hindus and Muslims, with an evening puja that fills the compound every day of the year.","img":"photo-1566766188646-5d0310191714","shot":"Fire dancers performing at night","lead":"A pilgrimage town where three religions use the same ground, and have done for centuries without much fuss about it.","body":["The Ruhunu Maha Kataragama Devalaya holds no image — the shrine contains a casket, and what is inside it is not shown. Buddhists come for the god Kataragama, Hindus for Murugan, and there is a mosque in the same compound. The evening puja at 6.30 draws several hundred people, with drumming, and it happens every single day.","The Esala festival in July or August is the intense version: two weeks of processions with elephants, kavadi dancing, and devotees who walk on fire and pierce themselves as acts of penance. It is not staged for visitors, so watch quietly and dress as the pilgrims do — white, covered, shoes off."],"facts":[["Best time","Jul–Aug for the Esala festival"],["How long","An evening"],["Getting there","45 min from Tissamaharama"]]},{"slug":"nilaveli-beach-house","name":"Nilaveli Beach House","region":"Nilaveli · partner stay","img":"photo-1580910527739-556eb89f9d65","shot":"Palms along the eastern shore","text":"Six rooms behind the dune on the quietest stretch of the east coast.","kind":"stay","lead":"Fifteen kilometres north of Trincomalee, on the beach everyone drives past on the way to Pigeon Island.","body":["The east coast runs on the opposite season to the south, so this is where we send people between May and September when Galle is under rain. The water off Nilaveli is flat and shallow a long way out.","Pigeon Island is a twenty-minute boat ride offshore — reef sharks, turtles and live coral in three metres of water. Go early; the island caps visitor numbers and the morning boats are the calm ones."],"facts":[["Best time","May–Sep"],["Rooms","Six, all sea-facing"],["Nearest","Trincomalee, 30 min"]]},{"slug":"ratnapura-gem-valley","name":"Ratnapura Gem Valley","region":"Ratnapura · partner stay","img":"photo-1588598198321-9735fd52455b","shot":"Forested ridges above the town","text":"A planter’s house above the gem pits, halfway between the coast and Adam’s Peak.","kind":"stay","lead":"The City of Gems, in the wettest corner of the island, and the obvious first night for anyone climbing Sri Pada.","body":["Ratnapura sits on alluvial gravels that have produced sapphires for two thousand years, and the pits are still worked by hand with the same shaft-and-basket method. The gem museum and a working pit can both be seen in a morning.","It is also the classic start for the Adam’s Peak climb by the older, longer Ratnapura trail rather than the crowded Hatton steps — seven hours up instead of three, and almost nobody on it."],"facts":[["Best time","Dec–Apr"],["Rooms","Five"],["Nearest","Adam’s Peak trailhead, 1 hr"]]},{"slug":"panama-point-cabanas","name":"Panama Point Cabanas","region":"Panama · partner stay","img":"photo-1569670380685-4582bf29a24a","shot":"Coconut palms above the surf coast","text":"Four cabanas at the far end of the surf coast, past where the road gives up.","kind":"stay","lead":"Twenty minutes south of Arugam Bay, and about twenty years behind it.","body":["Panama is the last village on this coast before Kumana National Park. The point breaks either side of it — Peanut Farm and Okanda — carry a fraction of the crowd of Arugam Bay, and the walk in is part of the appeal.","Kumana is the other reason to be down here. It is Yala’s eastern neighbour, with a mangrove swamp that fills with painted storks and pelicans from May, and a tenth of the jeep traffic."],"facts":[["Best time","May–Sep"],["Rooms","Four cabanas"],["Nearest","Arugam Bay, 20 min"]]},{"slug":"tissamaharama-lake-lodge","name":"Tissamaharama Lake Lodge","region":"Tissamaharama · partner stay","img":"photo-1571406761758-9a3eed5338ef","shot":"Elephants in the dry-zone scrub nearby","text":"Eight rooms on the old tank, and the closest proper beds to the Yala gate.","kind":"stay","lead":"The base camp for Yala, on a 2,300-year-old reservoir with pelicans on it at dawn.","body":["A 4.30am start for the park gate is a great deal easier from here than from the coast. The Tissa Wewa was built in the 3rd century BC and still irrigates the paddy around the town, and the birdlife on it at first light is worth the early hour on its own.","Bundala National Park is twenty minutes the other way — flamingos between September and March, and far fewer vehicles than Yala."],"facts":[["Best time","Feb–Jul for Yala"],["Rooms","Eight"],["Nearest","Yala main gate, 45 min"]]},{"slug":"koggala-lagoon-villa","name":"Koggala Lagoon Villa","region":"Koggala · partner stay","img":"photo-1519566335946-e6f65f0f4fdf","shot":"Stilt fishermen on the southern reef","text":"A four-bedroom house on the lagoon, with the stilt fishermen ten minutes down the road.","kind":"stay","lead":"Between Galle and Weligama, on a lagoon with eight islands in it and a cinnamon plantation on one of them.","body":["The lagoon is the draw: a dawn boat through the mangroves gets you monitor lizards, kingfishers and a working cinnamon island where the bark is still peeled by hand. It takes about two hours and costs very little.","The surf beaches at Ahangama and Midigama are five minutes west, Galle Fort is twenty minutes east, and the stilt fishermen — the genuine ones, not the posed line-up — work the reef in front of the village."],"facts":[["Best time","Nov–Apr"],["Rooms","Four bedrooms, whole-house"],["Nearest","Galle, 20 min"]]},{"slug":"giritale-tank-lodge","name":"Giritale Tank Lodge","region":"Giritale · partner stay","img":"photo-1559038331-02f4bae92a3d","shot":"Dry-zone forest around the tank","text":"Ten rooms above an 8th-century reservoir, twenty minutes from Polonnaruwa.","kind":"stay","lead":"A quieter alternative to staying in Polonnaruwa itself, on a tank built in 800 AD and still full.","body":["Giritale sits between Polonnaruwa and Minneriya, which makes it the practical base for both: ruins in the morning, elephants in the late afternoon. The tank draws elephants to its far shore in the dry months.","Minneriya and Kaudulla are twenty and thirty minutes away. The Gathering — several hundred elephants on the receding Minneriya tank bed — runs from roughly July to October, and is the largest congregation of wild Asian elephants anywhere."],"facts":[["Best time","Jul–Oct for the Gathering"],["Rooms","Ten"],["Nearest","Polonnaruwa, 20 min"]]},{"slug":"wadduwa-palm-cabanas","name":"Wadduwa Palm Cabanas","region":"Wadduwa · partner stay","img":"photo-1646894232861-a0ad84f1ad5d","shot":"An aerial view of a palm-fringed beach","text":"Six cabanas in a coconut grove an hour from the airport, for the first or last night.","kind":"stay","lead":"Far enough from Colombo to hear the sea, close enough to make a morning flight without setting an alarm for 3am.","body":["Most itineraries waste their first night in an airport hotel. Wadduwa is an hour down the coast on the expressway, which makes it a better place to sleep off the flight — a long beach, a coconut estate, and almost no one on it midweek.","It is also a sensible last stop. The expressway runs from here to the airport without going through Colombo traffic, which removes the single most stressful hour of most trips."],"facts":[["Best time","Nov–Apr"],["Rooms","Six cabanas"],["Nearest","Airport, 1 hr by expressway"]]},{"slug":"jeep-safari","name":"Jeep Safari","region":"Wilpattu National Park","shot":"People in a safari vehicle beside a wild elephant","text":"The oldest and largest park in the country, and the one where you still get a track to yourself. Leopards, sloth bears and sixty natural lakes.","kind":"adventure","lead":"Wilpattu is three times the size of Yala and takes a fraction of the vehicles, which changes the experience completely.","body":["The park is named for its villus — natural sand-rimmed lakes that fill with rain and draw everything to them. There are around sixty, and game drives work from one to the next rather than quartering open scrub.","It closed for most of the civil war and reopened in 2010, which is why it is still quiet. Leopard sightings are less frequent than Yala but far less crowded when they happen; sloth bears are best from February to June when the palu fruit ripens."],"facts":[["Best time","Feb–Oct"],["How long","Half or full day"],["Getting there","1 hr from Anuradhapura"]],"img":"photo-1566650576880-6740b03eaad1"},{"slug":"sea-kayaking","name":"Sea Kayaking","region":"Madu Ganga, Balapitiya","shot":"People paddling canoes down a Sri Lankan river","text":"Paddle a mangrove river with sixty-four islands in it, past cinnamon peelers and a temple you can only reach by water.","kind":"adventure","lead":"A two-hour paddle through mangrove tunnels on a wetland protected under the Ramsar convention.","body":["The Madu Ganga estuary covers 900 hectares and holds sixty-four islands, several inhabited. Kayaks get you into the mangrove tunnels the motorboats cannot enter, which is where the kingfishers and water monitors are.","Kothduwa temple sits on its own island and is reached only by boat. On another, two families still peel cinnamon by hand and will show you the whole process, from cutting to drying, in about twenty minutes."],"facts":[["Best time","Nov–Apr, early morning"],["How long","2–3 hrs"],["Getting there","1.5 hrs from Colombo"]],"img":"photo-1700738566151-da1674e4335b"},{"slug":"rainforest-trek","name":"Rainforest Trek","region":"Sinharaja, Kudawa","shot":"A river running through lush green rainforest","text":"The last major stand of primary lowland rainforest on the island, with more than half its trees found nowhere else on earth.","kind":"adventure","lead":"A UNESCO World Heritage site where endemism runs at about 60 per cent for trees and 95 per cent for birds.","body":["Sinharaja is dense, wet and dark, and a guide is compulsory — which is fair, because you would walk past most of it without a trained eye. The mixed-species feeding flocks are the thing to wait for: twenty or thirty birds of a dozen species moving through the canopy together, a phenomenon studied here for forty years.","Leeches are a certainty in the wet season, and leech socks cost almost nothing at the entrance. Trails run from two hours to a full day out of the Kudawa gate on the north side."],"facts":[["Best time","Jan–Mar, Aug–Sep"],["How long","3 hrs to a full day"],["Getting there","2.5 hrs from Galle"]],"img":"photo-1698761519339-2aee1b681801"},{"slug":"surfing","name":"Surfing","region":"Weligama Bay","shot":"A surfer riding a wave on the Sri Lankan coast","text":"A long sandy-bottomed beach break about as forgiving as a first surf lesson gets, and it works all winter.","kind":"adventure","lead":"Weligama is where most people in Sri Lanka stand up on a board for the first time, and there is a good reason for that.","body":["The bay is wide, the bottom is sand rather than reef, and the waves reform gently all the way to the beach — which means a fall costs you nothing worse than a mouthful of seawater. Boards and instructors line the whole strand and the season runs November to April.","When you have outgrown it, the reef breaks at Midigama are ten minutes west and considerably less forgiving: Lazy Left, Rams and Plantations all break over shallow coral and want some experience."],"facts":[["Best time","Nov–Apr"],["How long","A 2-hr lesson, or all week"],["Getting there","30 min from Galle"]],"img":"photo-1752498226553-4bc3894109c1"}];
const IMG = (id, w) => `https://images.unsplash.com/${id}?fm=jpg&q=80&w=${w}&auto=format&fit=crop`;
const pic = (d, w) => d.art ? d.art : IMG(d.img, w);
const slug = new URLSearchParams(location.search).get('p');
const d = ALL.find(x => x.slug === slug);
const main = document.getElementById('main');

if (!d){
  main.innerHTML = `<div class="wrap miss">
    <h1 style="font-size:1.6rem;font-weight:800;text-transform:uppercase">Place not found</h1>
    <p style="margin-top:.8rem;color:rgba(30,42,34,.6);font-weight:300">Try one of the five below.</p></div>`;
} else {
  document.title = d.name + ' — TripzaCeylon';
  main.innerHTML = `
    <div class="hero">
      <img src="${pic(d, 2000)}" alt="${d.shot}">
      <div class="veil"></div>
      <div class="in"><div class="wrap">
        <span class="chip">${d.region}</span>
        <h1>${d.name}</h1>
      </div></div>
    </div>
    <div class="wrap layout">
      <div>
        <p class="lead">${d.lead}</p>
        <div class="body">${d.body.map(p => `<p>${p}</p>`).join('')}</div>
        <p class="shot">Photograph: ${d.shot}</p>
      </div>
      <aside class="facts">
        <h3>At a glance</h3>
        <dl>${d.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
        <a class="btn" href="build-your-trip.html#enquire">Enquire about this
          <svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7v-5H4v-4h9V5Z"/></svg></a>
        <a class="btn ghost" href="build-your-trip.html">Add it to a route</a>
      </aside>
    </div>`;
}

/* ---------- five more, as cards ---------- */
const pool = ALL.filter(x => x.slug !== slug);
const PICK = [];
for (let i = 0; i < 5 && pool.length; i++) PICK.push(pool.splice(Math.floor(i * pool.length / 5), 1)[0]);

document.getElementById('grid').innerHTML = PICK.map(x => `
  <a class="mcard" href="place.html?p=${x.slug}">
    <div class="pic"><img loading="lazy" src="${pic(x, 700)}" alt="${x.shot}"></div>
    <div class="txt">
      <h4>${x.name}</h4>
      <span class="reg">${x.region}</span>
      <p>${x.text}</p>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7v-5H4v-4h9V5Z"/></svg></span>
    </div>
  </a>`).join('');
</script>
